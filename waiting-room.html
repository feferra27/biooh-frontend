<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BiOOH • Sala de Espera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:      #C8102E;
      --ink:      #111827;
      --muted:    #6B7280;
      --border:   #E5E7EB;
      --fh:       88px;   /* footer height */
      --hh:       64px;   /* header height */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #fff; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); }

    /* ════ HEADER ════ */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--hh);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: #fff; border-bottom: 1px solid var(--border);
      z-index: 300;
    }
    .back-btn {
      border: 1px solid var(--border); background: #fff;
      padding: 7px 16px; border-radius: 8px;
      font: 600 13px/1 'DM Sans', sans-serif; color: var(--ink);
      cursor: pointer; transition: background .15s;
    }
    .back-btn:hover { background: #F9FAFB; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark  { width: 32px; height: 32px; border-radius: 7px; background: var(--red); }
    .brandtxt { font-weight: 700; font-size: 17px; letter-spacing: -.3px; }

    /* ════ STAGE ════ */
    #stage {
      position: fixed;
      top: var(--hh); bottom: var(--fh); left: 0; right: 0;
      overflow: hidden;
      background: #fff;
    }

    /* ════ SPINNER ════ */
    #spinner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
    }
    .spin-ring {
      width: 42px; height: 42px;
      border: 3px solid var(--border); border-top-color: var(--red);
      border-radius: 50%; animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #spinner p { color: var(--muted); font-size: 14px; font-weight: 500; }

    /* ════ SLIDE ════ */
    .slide {
      position: absolute; inset: 0;
      display: grid; grid-template-columns: 46% 54%;
      opacity: 0; animation: fi .55s ease forwards;
    }
    @keyframes fi { to { opacity: 1; } }

    /* — photo col — */
    .s-photo {
      position: relative; overflow: hidden;
      background: #e5e7eb;
    }
    .s-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    /* soft right-edge fade */
    .s-photo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 50%, #fff 100%);
      pointer-events: none;
    }

    /* — text col — */
    .s-body {
      display: flex; align-items: center;
      padding: 32px 48px 32px 36px;
      background: #fff; overflow: hidden;
    }
    .s-inner { width: 100%; }

    .s-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 42px; font-weight: 400; line-height: 1.15;
      color: var(--ink); margin-bottom: 24px;
    }

    .sec { margin-bottom: 18px; }
    .sec-head {
      font-size: 12px; font-weight: 700; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--red); margin-bottom: 6px;
    }
    .sec-text {
      font-size: 17px; line-height: 1.65; color: #374151; font-weight: 400;
    }
    .bul { list-style: none; margin-top: 6px; }
    .bul li {
      font-size: 17px; line-height: 1.6; color: #374151;
      padding: 5px 0 5px 26px; position: relative;
    }
    .bul li::before {
      content: '›'; position: absolute; left: 0;
      color: var(--red); font-size: 22px; line-height: 1.25; font-weight: 700;
    }

    /* ════ FOOTER ════ */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--fh);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 36px; gap: 0;
      background: #fff; border-top: 1px solid var(--border);
      z-index: 300;
    }

    .ft-left  { display: flex; align-items: baseline; gap: 10px; }
    .ft-city  { font-size: 15px; font-weight: 700; color: var(--ink); }
    .ft-date  { font-size: 14px; font-weight: 400; color: var(--muted); }

    .ft-mid   { display: flex; align-items: center; gap: 20px; }
    .ft-div   { width: 1px; height: 44px; background: var(--border); }
    .ft-time  {
      font-size: 38px; font-weight: 700; color: var(--ink);
      font-variant-numeric: tabular-nums; letter-spacing: -1.5px;
    }

    .ft-right { display: flex; justify-content: flex-end; gap: 22px; }
    .wx       { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .wx-lbl   { font-size: 11px; font-weight: 600; color: var(--muted); }
    .wx-tmp   { font-size: 21px; font-weight: 700; color: var(--ink); }
    .wx-ico   { font-size: 20px; line-height: 1; }
  </style>
</head>
<body>

<header>
  <button class="back-btn" onclick="location.href='index.html'">← Voltar</button>
  <div class="brand">
    <div class="mark"></div>
    <span class="brandtxt">BiOOH</span>
  </div>
</header>

</div>

  </div>
</footer>

  var d=new Date();

  var dt=document.getElementById('ftDate');

}

          'Glicemia em jejum ≥ 100 mg/dL',
          'Triglicerídeos ≥ 150 mg/dL ou HDL baixo']},
      {h:'Como reverter o quadro',
       b:['Reduza a gordura abdominal — ela é a mais perigosa para o coração',
          'Adote o padrão mediterrâneo: vegetais, azeite, peixes e integrais',
          'Invista em pelo menos 200 minutos de atividade física por semana',
          'Realize check-up anual completo com exames de sangue']}
    ]
  }
];

// ─── PLAYER ──────────────────────────────────────────────────────────────────
(function(){
  var idx=-1, timer=null;

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildSecs(secs){
    if(!secs||!secs.length) return '';
    return secs.map(function(s){
      var h = s.h ? '<div class="sec-head">'+esc(s.h)+'</div>' : '';
      var t = s.t ? '<p class="sec-text">'+esc(s.t)+'</p>' : '';
      var b = '';
      if(s.b&&s.b.length){
        b='<ul class="bul">'+s.b.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
      }
      return '<div class="sec">'+h+t+b+'</div>';
    }).join('');
  }

  function show(item){
    var stage=document.getElementById('stage');
    if(!stage||!item) return;
    stage.innerHTML='';

    var slide=document.createElement('div');
    slide.className='slide';
    slide.innerHTML=
      '<div class="s-photo">'+
        '<img src="'+esc(item.img||'')+'" alt="" loading="eager">'+
      '</div>'+
      '<div class="s-body">'+
        '<div class="s-inner">'+
          '<h1 class="s-title">'+esc(item.title||'')+'</h1>'+
          buildSecs(item.secs)+
        '</div>'+
      '</div>';
    stage.appendChild(slide);
  }

  function next(){
    clearTimeout(timer);
    idx=(idx+1)%SLIDES.length;
    show(SLIDES[idx]);
    timer=setTimeout(next, SLIDES[idx].dur||20000);
  }

  // hide spinner and start
  var sp=document.getElementById('spinner');
  if(sp) sp.style.display='none';
  next();
})();
</script>
</body>
</html>
